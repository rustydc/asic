<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 720" width="1360" height="720" role="img" aria-label="A layer die: sequencer, command bus, the units behind their adapters, the vector buffer, the memory path"><style>
.box{fill:#ffffff;stroke:#2a3a4a;stroke-width:1.2}
.unit{fill:#e8f1f6;stroke:#1f5f7a;stroke-width:1.2}
.mem{fill:#fbf1de;stroke:#9a6a12;stroke-width:1.2}
.ctl{fill:#eaf3e6;stroke:#3d7a2e;stroke-width:1.2}
.ext{fill:#f1eef7;stroke:#5a4a8a;stroke-width:1.2}
.bus{fill:#dfe6ec;stroke:#2a3a4a;stroke-width:1.2}
.group{fill:none;stroke:#8a96a3;stroke-width:1;stroke-dasharray:4 3}
.t{font:12px 'IBM Plex Sans',system-ui,sans-serif;fill:#17202a}
.h{font:600 13px 'IBM Plex Sans',system-ui,sans-serif;fill:#17202a}
.s{font:10px 'IBM Plex Mono',ui-monospace,monospace;fill:#3e4c5a}
.g{font:600 11px 'IBM Plex Sans',system-ui,sans-serif;fill:#5a6773;letter-spacing:.06em}
.e{stroke:#2a3a4a;stroke-width:1.2;fill:none;marker-end:url(#ah)}
.e2{stroke:#2a3a4a;stroke-width:1.2;fill:none;marker-end:url(#ah);marker-start:url(#at)}
.ed{stroke:#9a6a12;stroke-width:1.4;fill:none;marker-end:url(#ahm);marker-start:url(#atm)}
.ec{stroke:#3d7a2e;stroke-width:1.2;fill:none;marker-end:url(#ahc)}
.lbl{font:10px 'IBM Plex Mono',ui-monospace,monospace;fill:#3e4c5a}
</style><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a3a4a"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#2a3a4a"/></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6a12"/></marker>
<marker id="atm" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#9a6a12"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d7a2e"/></marker>
</defs><rect class="ctl" x="20" y="30" width="200" height="118" rx="4"/><text class="h" x="120.0" y="47" text-anchor="middle">Token sequencer</text><text class="s" x="120.0" y="61" text-anchor="middle">program memory 256b x DEPTH</text><text class="s" x="120.0" y="75" text-anchor="middle">per-buffer scoreboards</text><text class="s" x="120.0" y="89" text-anchor="middle">wr_cnt / rd_cnt per id</text><text class="s" x="120.0" y="103" text-anchor="middle">in-order issue, tag return</text><rect class="box" x="240" y="30" width="150" height="60" rx="4"/><text class="h" x="315.0" y="47" text-anchor="middle">Constants SRAM</text><text class="s" x="315.0" y="61" text-anchor="middle">requant mult/shift, eps</text><text class="s" x="315.0" y="75" text-anchor="middle">gains; ~80 KB over SPI</text><rect class="ext" x="240" y="100" width="150" height="48" rx="4"/><text class="h" x="315.0" y="117" text-anchor="middle">Link + SPI</text><text class="s" x="315.0" y="131" text-anchor="middle">ring packets in/out</text><text class="s" x="315.0" y="145" text-anchor="middle">mode strap, boot</text><path class="ec" d="M140 148 L140 190"/><text class="lbl" x="150" y="175" text-anchor="start">command bus: cmd_valid[unit], engine, len, src, dst, a2, a3, arg, tag / cmd_ready, done_valid, done_tag</text><rect class="bus" x="20" y="190" width="1320" height="16" rx="3"/><text class="s" x="680" y="202" text-anchor="middle">command bus (one unit addressed per cycle; each engine returns its tag on its done port)</text><rect class="unit" x="45" y="226" width="190" height="84" rx="4"/><text class="h" x="140.0" y="243" text-anchor="middle">Pass adapter</text><text class="s" x="140.0" y="257" text-anchor="middle">tiles: NT x (ROM + columns)</text><text class="s" x="140.0" y="271" text-anchor="middle">pass table: pass, rb,</text><text class="s" x="140.0" y="285" text-anchor="middle">chain, last, raw, nbytes,</text><text class="s" x="140.0" y="299" text-anchor="middle">dst_off; T tokens a pass</text><path class="ec" d="M140.0 206 L140.0 226"/><path class="e2" d="M140.0 310 L140.0 340"/><rect class="unit" x="245" y="226" width="120" height="84" rx="4"/><text class="h" x="305.0" y="243" text-anchor="middle">Norm x2</text><text class="s" x="305.0" y="257" text-anchor="middle">fabric_rmsnorm</text><text class="s" x="305.0" y="271" text-anchor="middle">RMS / L2 / gated</text><text class="s" x="305.0" y="285" text-anchor="middle">n_beats at run time</text><path class="ec" d="M305.0 206 L305.0 226"/><path class="e2" d="M305.0 310 L305.0 340"/><rect class="unit" x="375" y="226" width="120" height="84" rx="4"/><text class="h" x="435.0" y="243" text-anchor="middle">Conv</text><text class="s" x="435.0" y="257" text-anchor="middle">fabric_conv_silu</text><text class="s" x="435.0" y="271" text-anchor="middle">4-tap causal + SiLU</text><text class="s" x="435.0" y="285" text-anchor="middle">hist -&gt; hist_next</text><path class="ec" d="M435.0 206 L435.0 226"/><path class="e2" d="M435.0 310 L435.0 340"/><rect class="unit" x="505" y="226" width="110" height="84" rx="4"/><text class="h" x="560.0" y="243" text-anchor="middle">Gates</text><text class="s" x="560.0" y="257" text-anchor="middle">fabric_head_gates</text><text class="s" x="560.0" y="271" text-anchor="middle">a, b accs -&gt;</text><text class="s" x="560.0" y="285" text-anchor="middle">decay, beta</text><path class="ec" d="M560.0 206 L560.0 226"/><path class="e2" d="M560.0 310 L560.0 340"/><rect class="unit" x="625" y="226" width="150" height="84" rx="4"/><text class="h" x="700.0" y="243" text-anchor="middle">State x4</text><text class="s" x="700.0" y="257" text-anchor="middle">fabric_delta_state8</text><text class="s" x="700.0" y="271" text-anchor="middle">header beat + K rows</text><text class="s" x="700.0" y="285" text-anchor="middle">q,k,v,gates -&gt; y</text><path class="ec" d="M700.0 206 L700.0 226"/><path class="e2" d="M700.0 310 L700.0 340"/><rect class="unit" x="785" y="226" width="100" height="84" rx="4"/><text class="h" x="835.0" y="243" text-anchor="middle">SwiGLU</text><text class="s" x="835.0" y="257" text-anchor="middle">fabric_swiglu</text><text class="s" x="835.0" y="271" text-anchor="middle">silu(g) * u</text><path class="ec" d="M835.0 206 L835.0 226"/><path class="e2" d="M835.0 310 L835.0 340"/><rect class="unit" x="895" y="226" width="115" height="84" rx="4"/><text class="h" x="952.5" y="243" text-anchor="middle">Residual</text><text class="s" x="952.5" y="257" text-anchor="middle">fabric_residual</text><text class="s" x="952.5" y="271" text-anchor="middle">h + y*mult &gt;&gt; sh</text><path class="ec" d="M952.5 206 L952.5 226"/><path class="e2" d="M952.5 310 L952.5 340"/><rect class="unit" x="1020" y="226" width="140" height="84" rx="4"/><text class="h" x="1090.0" y="243" text-anchor="middle">Rotary x2</text><text class="s" x="1090.0" y="257" text-anchor="middle">table: pos-&gt;sin/cos</text><text class="s" x="1090.0" y="271" text-anchor="middle">head: norm, rotate</text><path class="ec" d="M1090.0 206 L1090.0 226"/><path class="e2" d="M1090.0 310 L1090.0 340"/><rect class="unit" x="1170" y="226" width="140" height="84" rx="4"/><text class="h" x="1240.0" y="243" text-anchor="middle">Attention x4</text><text class="s" x="1240.0" y="257" text-anchor="middle">fabric_attention</text><text class="s" x="1240.0" y="271" text-anchor="middle">online softmax, gate</text><text class="s" x="1240.0" y="285" text-anchor="middle">records from rows</text><path class="ec" d="M1240.0 206 L1240.0 226"/><path class="e2" d="M1240.0 310 L1240.0 340"/><rect class="bus" x="20" y="340" width="1320" height="40" rx="3"/><text class="h" x="680" y="357" text-anchor="middle">Vector buffer (fabric_vb): byte-addressed SRAM, 24-bit addresses, 16-byte beats</text><text class="s" x="680" y="373" text-anchor="middle">NR read ports (norm 4, tiles TMAX, conv 2, gates 2, state 4, swiglu 2, residual 2, rotary 2, attn 4, mem 1), NW=19 write ports with byte enables, read data one cycle later</text><rect class="group" x="20" y="400" width="1320" height="300" rx="8"/><text class="g" x="30" y="415">MEMORY PATH: ONE PORT PER DIE</text><rect class="mem" x="40" y="430" width="220" height="120" rx="4"/><text class="h" x="150.0" y="447" text-anchor="middle">Memory unit</text><text class="s" x="150.0" y="461" text-anchor="middle">mover: state/hist DMA</text><text class="s" x="150.0" y="475" text-anchor="middle">append: window, block,</text><text class="s" x="150.0" y="489" text-anchor="middle">index, block sums</text><text class="s" x="150.0" y="503" text-anchor="middle">index_scan + topk</text><text class="s" x="150.0" y="517" text-anchor="middle">record_reader -&gt; rows</text><path class="e2" d="M145 380 L145 430"/><path class="ec" d="M30 206 L30 490 L40 490"/><rect class="mem" x="290" y="450" width="120" height="80" rx="4"/><text class="h" x="350.0" y="467" text-anchor="middle">Arbiter</text><text class="s" x="350.0" y="481" text-anchor="middle">4 requesters</text><text class="s" x="350.0" y="495" text-anchor="middle">one req in flight</text><text class="s" x="350.0" y="509" text-anchor="middle">per requester</text><path class="ed" d="M260 490 L290 490"/><rect class="mem" x="440" y="450" width="140" height="80" rx="4"/><text class="h" x="510.0" y="467" text-anchor="middle">Bridge (CDC)</text><text class="s" x="510.0" y="481" text-anchor="middle">async FIFOs: req 4,</text><text class="s" x="510.0" y="495" text-anchor="middle">wdata 16, rdata 8</text><text class="s" x="510.0" y="509" text-anchor="middle">core clk &lt;-&gt; 250 MHz</text><path class="ed" d="M410 490 L440 490"/><text class="lbl" x="425" y="440" text-anchor="middle">memory port: req / wdata / rdata</text><rect class="mem" x="610" y="450" width="135" height="80" rx="4"/><text class="h" x="677.5" y="467" text-anchor="middle">Stripe unit</text><text class="s" x="677.5" y="481" text-anchor="middle">beat address -&gt;</text><text class="s" x="677.5" y="495" text-anchor="middle">device, 25b addr,</text><text class="s" x="677.5" y="509" text-anchor="middle">8b beats; x_done</text><path class="ed" d="M580 490 L610 490"/><rect class="mem" x="775" y="430" width="160" height="120" rx="4"/><text class="h" x="855.0" y="447" text-anchor="middle">Channel ctrl x16</text><text class="s" x="855.0" y="461" text-anchor="middle">HPI x16 protocol</text><text class="s" x="855.0" y="475" text-anchor="middle">MR0/4/8 init, refresh</text><text class="s" x="855.0" y="489" text-anchor="middle">tCEM, tCPH, latency</text><text class="s" x="855.0" y="503" text-anchor="middle">128b beats &lt;-&gt; 16b DQ</text><path class="ed" d="M745 490 L775 490"/><text class="lbl" x="760" y="440" text-anchor="middle">x_valid[dev]</text><rect class="mem" x="965" y="450" width="120" height="80" rx="4"/><text class="h" x="1025.0" y="467" text-anchor="middle">PHY</text><text class="s" x="1025.0" y="481" text-anchor="middle">delay lines</text><text class="s" x="1025.0" y="495" text-anchor="middle">DLL period/quarter</text><text class="s" x="1025.0" y="509" text-anchor="middle">DQS capture</text><path class="ed" d="M935 490 L965 490"/><rect class="ext" x="1115" y="440" width="110" height="100" rx="4"/><text class="h" x="1170.0" y="457" text-anchor="middle">PSRAM x16</text><text class="s" x="1170.0" y="471" text-anchor="middle">APS512XXN</text><text class="s" x="1170.0" y="485" text-anchor="middle">64 MB each</text><text class="s" x="1170.0" y="499" text-anchor="middle">ce_n, dq[15:0],</text><text class="s" x="1170.0" y="513" text-anchor="middle">dm, dqs</text><path class="ed" d="M1085 490 L1115 490"/><text class="s" x="40" y="590" text-anchor="start">per-context memory map (2 KB pages): for each recurrent layer the state (v_heads slots: header beat + K rows int8) and the conv history;</text><text class="s" x="40" y="606" text-anchor="start">for the global layer the window (local_window x KV heads x key+value), the block store (one record per closed block), the index (4-bit codes + scale per block), the block sums.</text><text class="s" x="40" y="640" text-anchor="start">the command bus operands are byte addresses into the vector buffer (src, dst, a2, a3) or beat addresses into memory (memory unit); len is a beat count or a token count.</text><text class="s" x="40" y="656" text-anchor="start">programs are written by fabric/sequencer.py, placed by fabric/engine.py (Layout) and encoded as 256-bit words: 250 bits used.</text></svg>