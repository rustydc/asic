<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 250" width="1180" height="250" role="img" aria-label="A tile: the via ROM, the column datapath, the shared requantizer"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a3a4a"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#2a3a4a"/></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6a12"/></marker>
<marker id="atm" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#9a6a12"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d7a2e"/></marker>
</defs><rect class="box" x="20" y="60" width="160" height="100" rx="4"/><text class="h" x="100.0" y="77" text-anchor="middle">Via ROM</text><text class="s" x="100.0" y="91" text-anchor="middle">4096 rows x 64 cols x 4b</text><text class="s" x="100.0" y="105" text-anchor="middle">signed-digit pairs</text><text class="s" x="100.0" y="119" text-anchor="middle">read P=2 rows per cycle</text><text class="s" x="100.0" y="133" text-anchor="middle">by cycle counter</text><rect class="unit" x="230" y="40" width="310" height="140" rx="4"/><text class="h" x="385.0" y="57" text-anchor="middle">Columns (fabric_columns)</text><text class="s" x="385.0" y="71" text-anchor="middle">stage A: taps select (no arithmetic)</text><text class="s" x="385.0" y="85" text-anchor="middle">stage B: carry-save term reduction</text><text class="s" x="385.0" y="99" text-anchor="middle">stage C: carry-save accumulate (sum, carry)</text><text class="s" x="385.0" y="113" text-anchor="middle">T tokens: T accumulator sets</text><text class="s" x="385.0" y="127" text-anchor="middle">psum_in chain from the previous row block</text><path class="e" d="M180 110 L230 110"/><text class="lbl" x="205" y="100" text-anchor="middle">rom_words</text><rect class="unit" x="620" y="40" width="240" height="140" rx="4"/><text class="h" x="740.0" y="57" text-anchor="middle">Requantizer walk</text><text class="s" x="740.0" y="71" text-anchor="middle">one shared unit per tile</text><text class="s" x="740.0" y="85" text-anchor="middle">walks the 64 columns after 2048 cycles</text><text class="s" x="740.0" y="99" text-anchor="middle">resolve carries (2 x 12b), x mult,</text><text class="s" x="740.0" y="113" text-anchor="middle">3 add stages, shift, saturate</text><text class="s" x="740.0" y="127" text-anchor="middle">9 cycles after the walk</text><path class="e" d="M540 110 L620 110"/><text class="lbl" x="580" y="100" text-anchor="middle">acc pair</text><rect class="box" x="900" y="40" width="260" height="140" rx="4"/><text class="h" x="1030.0" y="57" text-anchor="middle">Outputs</text><text class="s" x="1030.0" y="71" text-anchor="middle">q_out: T x 64 int8 (q_valid)</text><text class="s" x="1030.0" y="85" text-anchor="middle">psum_out: T x 64 x ACC, for the</text><text class="s" x="1030.0" y="99" text-anchor="middle">chained next tile (raw)</text><text class="s" x="1030.0" y="113" text-anchor="middle">done</text><path class="e" d="M860 110 L900 110"/><text class="s" x="20" y="215" text-anchor="start">inputs: start (loads accumulators from psum_in), x_valid / x_data (P activations per cycle per token, in row order), x_ready, mult/shift per column from the constants SRAM.</text></svg>