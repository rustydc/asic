interface_kinds:
  link:
    description: 8-bit source-synchronous DDR parallel link, 125 MHz clock (250 MB/s raw, 10 MB/s used at the design point), ready/valid, CRC in packet; a quarter the width and half the clock of the single board's link, because this board needs a hundredth of the bandwidth and every hop crosses two card-edge connectors
    signals: {data: 8, clock: 1, valid: 1, ready_back: 1, sof: 1}
    io_standard: 1.8 V LVCMOS series-terminated (placeholder)
    max_length_mm: 200
  psram_x16:
    description: one HPI x16 PSRAM port (APS512XXN in x16 mode; DQ, DQS/DM per byte lane, CE#); the single-ended CLK is shared by four devices and counted under psram_clk
    signals: {dq: 16, dqs: 2, ce: 1}
  psram_clk:
    description: the four single-ended 250 MHz PSRAM clocks, one per group of four devices, placed with the small interfaces
    signals: {clk: 4}
    misc: true               # placed with the small interfaces on the die
    on_card: true            # wired to the card's devices, never over the connector
  pcie_x16_edge:
    description: PCIe x16 card-edge connector used mechanically, through-hole, 82 positions per side at 1.0 mm with our own pinout (placeholder geometry)
    signals: {side_a: 82, side_b: 82}
  ddr4_x16:
    signals: {dq: 16, dqs_pairs: 2, dm: 2, addr_cmd: 28, ck_pairs: 1, ctrl: 6}
  ddr4_x64:
    description: FPGA-side aggregate of four ddr4_x16 devices
    signals: {dq: 64, dqs_pairs: 8, dm: 8, addr_cmd: 28, ck_pairs: 1, ctrl: 6}
  pcie_gen4_x8:
    signals: {tx_pairs: 8, rx_pairs: 8, refclk_pair: 1, perst: 1, wake: 1}
  mgmt_spi:
    description: SPI from FPGA, one chip select per ASIC; telemetry, config, thermal diode readout
    signals: {sclk: 1, mosi: 1, miso: 1, cs: 1, irq: 1}
  jtag:
    signals: {tck: 1, tms: 1, tdi: 1, tdo: 1, trst: 1}
  refclk:
    signals: {clk_pair: 1}
  strap:
    signals: {pins: 2}
  sfp_plus:
    signals: {tx_pair: 1, rx_pair: 1, i2c: 2, ctrl: 4}
  qspi:
    signals: {pins: 6}
  uart:
    signals: {pins: 2}

# Power tree: 12 V from the CRPS modules across the motherboard and over
# every card edge; each card converts it to its own core and I/O rails
# beside the die, so no low-voltage current crosses a connector or a plane.
power_tree:
  input_bus: 12 V from two CRPS modules, 1+1 redundant, PMBus to the BMC; 12 V over the card edge to every module
  regulator_efficiency: 0.85
  rails:
    VDD_CORE:    {volts: 0.80, per: [layer_asic, head_asic], note: multiphase PoL buck on each card, PMBus; ~13 A at the design point, ~24 A at the 5K rating}
    VDD_PLL_0V9: {volts: 0.90, per: [layer_asic, head_asic], note: LDO on each card}
    VDD_IO_1V8:  {volts: 1.80, shared: true, note: ASIC IO, link IO, PSRAM; one regulator per card plus one on the motherboard for the clock generator}
    VCCINT_0V85: {volts: 0.85, per: [fpga]}
    VCCAUX_1V8:  {volts: 1.80, per: [fpga]}
    VCCO_1V8:    {volts: 1.80, per: [fpga]}
    VCCO_1V2:    {volts: 1.20, per: [fpga], note: DDR4 IO}
    MGTAVCC:     {volts: 0.90, per: [fpga], note: PCIe/SFP transceivers}
    MGTAVTT:     {volts: 1.20, per: [fpga]}
    VDD_1V2:     {volts: 1.20, shared: true, note: DDR4}
    VPP_2V5:     {volts: 2.50, shared: true, note: DDR4}
    VDD_3V3:     {volts: 3.30, shared: true, note: SFP, BMC, EEPROM, LEDs, misc}

misc:
  - board ID EEPROM (I2C) on the motherboard and on every card
  - card presence pin per slot to the BMC; per-ASIC thermal diode via mgmt SPI
  - PMBus on every card's core VRM for per-ASIC current telemetry
  - FPGA config QSPI flash, JTAG header, UART debug header
  - six 40 mm fan headers, PWM and tach to the BMC
  - status LEDs on the rear panel and one per card
