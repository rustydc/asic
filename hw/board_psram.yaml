# Appliance board, open-IP variant: block-level schematic capture.
#
# The 9B geometry on a 28 nm-class die with sixteen HPI x16 PSRAM devices
# per layer ASIC and no DRAM PHY anywhere in the design
# (sim/config/qwen35_9b_psram16.json).  Sixteen devices are 304 memory
# signals, which no sensible package escapes onto a motherboard beside nine
# other chips, so this variant is modular: each ring chip sits on its own
# card with its memory and its core regulator, and only the ring, the
# management buses and 12 V cross the card-edge connector (48 contacts
# instead of 488 balls).  Ten cards stand in one folded row of slots on a
# short-depth 2U motherboard, the ring running out through the even slots
# and back through the odd ones; the two sets are staggered along the
# cards so every hop passes beyond the pins of the slot it skips.  Same schema as board.yaml plus `module_kinds`, `modules` and a
# `module` on each card-resident component; `python -m hw.board --source
# hw/board_psram.yaml` checks it, `hw.pinout` derives the package and
# `hw.kicad_gen` writes both PCBs.  Every electrical number is a budget to
# validate, and the connector geometry is a placeholder.

board:
  name: asic-llm-appliance-psram-a0
  form_factor: short-depth 2U rack chassis, one 420 x 160 mm motherboard with ten through-hole module slots in one folded row, host-attached over a PCIe cable, front-to-back fans between the cards, redundant CRPS
  form_factor_key: 2u_short
  layout: folded               # outbound cards in the even slots, returning cards in the odd ones; two_rows is the other layout
  slot_kind: through_hole      # the two sets staggered along the cards so the ribbons clear the skipped slot's pins; smt puts them on one line
  finger_layout: parallel      # link_in on side A and link_out on side B of the same twelve positions, so slot-to-slot hops are straight; offset gives each its own span
  host_interface: PCIe Gen4 x8 over a SlimSAS 8i cable to a host adapter card
  cooling: air; each card carries a small heatsink on its ASIC (about 10 W) and the PSRAMs run bare, the cards standing parallel to the front-to-back airflow at 22 mm pitch
  power_input:
    # 2000 W is far more than the board draws (about 200 W at the design
    # point); it is the same CRPS pair as the other boards so the chassis
    # power design is shared.
    - {name: CRPS 12 V, 1+1 redundant pair (two 2000 W modules), watts: 2000}

# Energy model.  The die is the 9B 28 nm-class one at 3 pJ per MAC; the
# design point is what the simulator measures with sixteen devices per
# ASIC, and it is bound by their 16 GB/s, not by the fabric.  The memory
# traffic is 4.72 MB per token per ASIC: three 1 MB recurrent states plus
# the global layer's index scan and selected KV at 128K, int4 at 16:1, at
# about 50 pJ per byte for a 1.8 V PSRAM interface.
power_model:
  mac_energy_pj: 3.0
  design_tokens_per_second: 2500
  memory_energy_pj_per_byte: 50.0
  memory_bytes_per_token_per_asic: 4720000
  report_tokens_per_second: [1000, 2500, 5000]

# ASIC package and ball map (hw/pinout.py).  Rated at 5000 tokens/s, the
# int4-state short-context point of the same sixteen devices, so a card
# that reaches it needs no new package.  Both link ports sit on the south
# edge, side by side, so each drops straight onto its finger group with no
# bend on the card; the small interfaces sit between them.  The memory
# takes the north, east and west edges, sixteen channels of nineteen
# signals with a ground after each in the outer five rows (the card is
# HDI, so five rows escape).
package_selection:
  rated_tokens_per_second: 5000
  amps_per_ball: 0.5
  signals_per_ground: 4
  signal_rows: 5
  edges: {link_in: S, link_out: S, memory: [N, E, W], misc: S}
  rail_balls: {VDD_IO_1V8: 24, VDD_PLL_0V9: 2}
  candidates:
    - {name: FCBGA784_28x28_P0.8, cols: 28, rows: 28, pitch: 0.8, body: 23.0, ball: 0.40}
    - {name: FCBGA961_31x31_P1.0, cols: 31, rows: 31, pitch: 1.0, body: 33.0, ball: 0.45}
    - {name: FCBGA1225_35x35_P0.8, cols: 35, rows: 35, pitch: 0.8, body: 29.0, ball: 0.40}
    - {name: FCBGA2025_45x45_P1.0, cols: 45, rows: 45, pitch: 1.0, body: 47.5, ball: 0.45}

# The cards.  One design, populated two ways: a layer module carries the
# sixteen PSRAMs, a head module leaves them off.  The connector is a PCIe
# x16 card edge used mechanically only, with our own pinout: 12 V and
# ground on the short section, the link ports on the same twelve positions
# (in on side A, out on side B, so a slot's out pin faces the next slot's in
# pin), the small interfaces after them.
module_kinds:
  layer_module:
    description: one layer ASIC, sixteen x16 PSRAMs in two rows above it, a core VRM and an I/O regulator; 12 V in over the edge.
    connector: pcie_x16_edge
    card_mm: [110, 70]
  head_module:
    description: the same card with a head-mode ASIC and the memory sites unpopulated.
    connector: pcie_x16_edge
    card_mm: [110, 70]

modules:
  M0: {kind: layer_module, slot: 0}
  M1: {kind: layer_module, slot: 1}
  M2: {kind: layer_module, slot: 2}
  M3: {kind: layer_module, slot: 3}
  M4: {kind: layer_module, slot: 4}
  M5: {kind: layer_module, slot: 5}
  M6: {kind: layer_module, slot: 6}
  M7: {kind: layer_module, slot: 7}
  M8: {kind: head_module, slot: 8}
  M9: {kind: head_module, slot: 9}

part_classes:
  layer_asic:
    description: fixed-weight 4-layer shard die with sixteen HPI x16 PSRAM ports and no DRAM PHY
    package: FCBGA, derived by hw/pinout.py from package_selection
    rails: [VDD_CORE, VDD_IO_1V8, VDD_PLL_0V9]
    static_w: 3
    macs_per_token: 866000000
    memory_traffic: true
    interfaces:
      link_in: {kind: link}
      link_out: {kind: link}
      psram_0: {kind: psram_x16}
      psram_1: {kind: psram_x16}
      psram_2: {kind: psram_x16}
      psram_3: {kind: psram_x16}
      psram_4: {kind: psram_x16}
      psram_5: {kind: psram_x16}
      psram_6: {kind: psram_x16}
      psram_7: {kind: psram_x16}
      psram_8: {kind: psram_x16}
      psram_9: {kind: psram_x16}
      psram_10: {kind: psram_x16}
      psram_11: {kind: psram_x16}
      psram_12: {kind: psram_x16}
      psram_13: {kind: psram_x16}
      psram_14: {kind: psram_x16}
      psram_15: {kind: psram_x16}
      psram_clk: {kind: psram_clk}
      mgmt: {kind: mgmt_spi}
      jtag: {kind: jtag}
      refclk: {kind: refclk}
      mode: {kind: strap, value: LAYER}
  head_asic:
    description: same die, head-mode personalization (LM head half); memory balls unconnected
    package: same package and ball map as layer_asic
    rails: [VDD_CORE, VDD_IO_1V8, VDD_PLL_0V9]
    static_w: 2
    macs_per_token: 508000000
    interfaces:
      link_in: {kind: link}
      link_out: {kind: link}
      mgmt: {kind: mgmt_spi}
      jtag: {kind: jtag}
      refclk: {kind: refclk}
      mode: {kind: strap, value: HEAD}
  psram:
    description: AP Memory APS512XXN-OB9-BG, 512 Mb x16 HPI (Xccela) PSRAM, 1.8 V, 250 MHz DDR (1 GB/s); 24-ball BGA 6 x 8 mm at 1.0 mm pitch
    package: BGA24 6 x 8 mm P1.0
    rails: [VDD_IO_1V8]
    tdp_w: 0.4
    interfaces:
      channel: {kind: psram_x16}
  fpga:
    description: controller FPGA with hard PCIe Gen4 block and DDR4 controller (AU25P/KU5P class)
    package: FFVB676 or similar
    rails: [VCCINT_0V85, VCCAUX_1V8, VCCO_1V8, VCCO_1V2, MGTAVCC, MGTAVTT]
    tdp_w: 25
    interfaces:
      pcie: {kind: pcie_gen4_x8}
      link_out: {kind: link}
      link_in: {kind: link}
      ddr4: {kind: ddr4_x64}
      mgmt_master: {kind: mgmt_spi}
      jtag: {kind: jtag}
      refclk: {kind: refclk}
      sfp: {kind: sfp_plus, optional: true}
      qspi: {kind: qspi}
      uart: {kind: uart}
  ddr4:
    description: DDR4 x16 for the embedding table and context metadata (4 x16 = x64, 4 GB)
    package: 96-ball FBGA
    rails: [VDD_1V2, VPP_2V5]
    tdp_w: 0.75
    interfaces:
      channel: {kind: ddr4_x16}
  clock_gen:
    description: low-jitter clock generator, 12+ outputs (Si5345 class)
    rails: [VDD_IO_1V8]
    tdp_w: 0.5
  sfp_cage:
    description: SFP+ cage on the rear panel for standalone 10GbE operation (optional fit)
    rails: [VDD_3V3]
    tdp_w: 1.5
  host_cable:
    description: SlimSAS 8i (SFF-8654) receptacle, PCIe Gen4 x8 plus sideband, to a host adapter card
    rails: []
    tdp_w: 0
  bmc:
    description: baseboard management controller (AST2600 class) with its own Ethernet, fans, PSU PMBus, card presence, FPGA UART
    rails: [VDD_3V3]
    tdp_w: 5
  rj45:
    description: BMC management Ethernet, rear panel
    rails: [VDD_3V3]
    tdp_w: 0.5
  psu_input:
    description: CRPS 12 V output blade receptacle (one per module) with PMBus and enable
    rails: []
    tdp_w: 0
  fan_header:
    description: 4-pin PWM fan header, one per 40 mm front fan
    rails: []
    tdp_w: 12

