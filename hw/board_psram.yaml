# The ring runs through the slots in slot order: 0 to 4 along row A, 5 to
# 9 back along row B, and closes at the FPGA at the open end.  Each hop is
# card leg, motherboard ribbon, card leg.  The memory channels never leave
# their card.
nets:
  ring:
    kind: link
    hops:
      - [U_FPGA.link_out, U_A0.link_in]
      - [U_A0.link_out, U_A1.link_in]
      - [U_A1.link_out, U_A2.link_in]
      - [U_A2.link_out, U_A3.link_in]
      - [U_A3.link_out, U_A4.link_in]
      - [U_A4.link_out, U_A5.link_in]
      - [U_A5.link_out, U_A6.link_in]
      - [U_A6.link_out, U_A7.link_in]
      - [U_A7.link_out, U_H0.link_in]
      - [U_H0.link_out, U_H1.link_in]
      - [U_H1.link_out, U_FPGA.link_in]
  memory:
    kind: psram_x16
    channels:
      - [U_A0.psram_0, U_M0_0.channel]
      - [U_A0.psram_1, U_M0_1.channel]
      - [U_A0.psram_2, U_M0_2.channel]
      - [U_A0.psram_3, U_M0_3.channel]
      - [U_A0.psram_4, U_M0_4.channel]
      - [U_A0.psram_5, U_M0_5.channel]
      - [U_A0.psram_6, U_M0_6.channel]
      - [U_A0.psram_7, U_M0_7.channel]
      - [U_A0.psram_8, U_M0_8.channel]
