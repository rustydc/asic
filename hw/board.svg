<text x="20" y="860" fill="#333">Blue: activation ring, 36-signal source-synchronous link per hop, clockwise on a regular 11-gon from the FPGA at the rear. Green: LPDDR5X x32 channels. Power budget 517 W load / 608 W input.</text>
<text x="20" y="880" fill="#333">Management SPI, JTAG chain, and reference clock fan out from U_FPGA / U_CLK to all ten ASICs (not drawn); the BMC, PSUs and fans are off the ring.</text>
