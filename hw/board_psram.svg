<rect x="40" y="265.0" width="96" height="80" rx="6" fill="#fff2cc" stroke="#333"/>
<text x="88" y="285.0" text-anchor="middle" font-weight="bold">U_FPGA</text>
<text x="88" y="303.0" text-anchor="middle">PCIe (cable)</text>
<text x="88" y="321.0" text-anchor="middle" font-size="10">DDR4 x64, clock, BMC</text>
<text x="20" y="580" fill="#333">Blue: activation ring, 12-signal link per hop, out through the even slots of one row and back through the odd ones between them (drawn here as two rows). Each module is one card: a ring chip, its memory and its core regulator. Power budget 251 W load / 295 W input.</text>
<text x="20" y="600" fill="#333">Management SPI, JTAG chain and reference clock reach every module through its slot (not drawn); the BMC, PSUs and fans are off the ring.</text>
