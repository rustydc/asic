<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="sans-serif" font-size="12">
<rect width="1180" height="620" fill="#fafafa"/>
<text x="20" y="28" font-size="16" font-weight="bold">asic-llm-appliance-psram-a0: block diagram</text>
<text x="20" y="46" fill="#555">short-depth 2U rack chassis, one 420 x 170 mm motherboard with ten through-hole module slots in one folded row, host-attached over a PCIe cable, front-to-back fans between the cards, redundant CRPS</text>
