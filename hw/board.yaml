# Appliance board: block-level schematic capture.
#
# This is the source of truth for the board netlist at the interface level.
# `python -m hw.board` checks it and renders hw/board.svg and hw/board.md.
# Every electrical number marked "placeholder" is a budget to validate, not a
# measured or vendor-confirmed value.

board:
  name: asic-llm-appliance-a0
  form_factor: PCIe CEM full-length (312 mm), full-height, dual-slot, passive heatsink + blower
  host_interface: PCIe Gen4 x8 (x4 electrically sufficient; see hw/README.md)
  power_input:
    - {name: PCIe slot 12 V, watts: 66}
    - {name: 12V-2x6 (12VHPWR) aux 12 V, watts: 600}
  # The auxiliary connector follows from the energy model below: at the
  # simulator's 14.5K tokens/s ceiling and 3 pJ per MAC the ASICs alone draw
  # about 390 W, so the two 8-pin connectors of the first draft (300 W) are
  # not enough.  A 7 nm-class die at ~1 pJ/MAC would bring the board back
  # under one 8-pin connector.

# Energy model for the ASICs.  Dynamic power is throughput times energy per
# token; the per-MAC energy is the one number measured so far (0.39 pJ on
# ASAP7 at default activity, fabric/results/pnr_asap7_signoff.json), derated
# for real activity and projected to a 28 nm-class node.  The design point
# is the simulator's global-stage ceiling (sim/README.md).
power_model:
  mac_energy_pj: 3.0
  design_tokens_per_second: 14500
  memory_energy_pj_per_byte: 40.0
  memory_bytes_per_token_per_asic: 4200000   # index scan + selected KV at 128K, int8, 4:1
  report_tokens_per_second: [5000, 14500, 25000, 50000]

# Part classes. `rails` lists the supply rails each part needs.  `tdp_w` is a
# placeholder budget per instance; the ASICs instead carry `static_w` plus
# `macs_per_token`, and their power follows from the model above.
part_classes:
  layer_asic:
    description: fixed-weight 4-layer shard die (personalized coefficient masks)
    package: FCBGA ~23 mm, ~400 balls (placeholder)
    rails: [VDD_CORE, VDD_IO_1V8, VDD_PLL_0V9, VDD2H_1V05, VDDQ_0V3]
    static_w: 3
    macs_per_token: 866000000
    memory_traffic: true
    interfaces:
      link_in: {kind: link}
      link_out: {kind: link}
      lpddr_ch0: {kind: lpddr5x_x32}
      lpddr_ch1: {kind: lpddr5x_x32}
      mgmt: {kind: mgmt_spi}
      jtag: {kind: jtag}
      refclk: {kind: refclk}
      mode: {kind: strap, value: LAYER}
  head_asic:
    description: same die as layer_asic, head-mode personalization (LM head half)
    package: FCBGA ~23 mm, ~400 balls (placeholder)
    rails: [VDD_CORE, VDD_IO_1V8, VDD_PLL_0V9]
    static_w: 2
    macs_per_token: 508000000
    interfaces:
      link_in: {kind: link}
      link_out: {kind: link}
      mgmt: {kind: mgmt_spi}
      jtag: {kind: jtag}
      refclk: {kind: refclk}
      mode: {kind: strap, value: HEAD}
  lpddr5x:
    description: LPDDR5X 16 Gb x32, 9600 MT/s (38.4 GB/s raw per device)
    package: 315-ball FBGA
    rails: [VDD1_1V8, VDD2H_1V05, VDD2L_0V9, VDDQ_0V3]
    tdp_w: 1.0
    interfaces:
      channel: {kind: lpddr5x_x32}
  fpga:
    description: controller FPGA with hard PCIe Gen4 block and DDR4 controller (AU25P/KU5P class)
    package: FFVB676 or similar
    rails: [VCCINT_0V85, VCCAUX_1V8, VCCO_1V8, VCCO_1V2, MGTAVCC, MGTAVTT]
    tdp_w: 25
    interfaces:
      pcie: {kind: pcie_gen4_x8}
      link_out: {kind: link}
      link_in: {kind: link}
      ddr4: {kind: ddr4_x64}
      mgmt_master: {kind: mgmt_spi}
      jtag: {kind: jtag}
      refclk: {kind: refclk}
      sfp: {kind: sfp_plus, optional: true}
      qspi: {kind: qspi}
      uart: {kind: uart}
  ddr4:
    description: DDR4 x16 for the embedding table and context metadata (4 x16 = x64, 4 GB)
    package: 96-ball FBGA
    rails: [VDD_1V2, VPP_2V5]
    tdp_w: 0.75
    interfaces:
      channel: {kind: ddr4_x16}
  clock_gen:
    description: low-jitter clock generator, 12+ outputs (Si5345 class)
    rails: [VDD_IO_1V8]
    tdp_w: 0.5
  sfp_cage:
    description: SFP+ cage on the bracket for standalone 10GbE operation (optional fit)
    rails: [VDD_3V3]
    tdp_w: 1.5

# Instances.
components:
  U_FPGA: {class: fpga, place: bracket end}
  U_A0: {class: layer_asic, layers: "0-3",   place: "row A, col 0"}
  U_A1: {class: layer_asic, layers: "4-7",   place: "row A, col 1"}
  U_A2: {class: layer_asic, layers: "8-11",  place: "row A, col 2"}
  U_A3: {class: layer_asic, layers: "12-15", place: "row A, col 3"}
  U_A4: {class: layer_asic, layers: "16-19", place: "row B, col 3"}
  U_A5: {class: layer_asic, layers: "20-23", place: "row B, col 2"}
  U_A6: {class: layer_asic, layers: "24-27", place: "row B, col 1"}
  U_A7: {class: layer_asic, layers: "28-31", place: "row B, col 0"}
  U_H0: {class: head_asic, vocab_rows: "0-124159",      place: bracket end}
  U_H1: {class: head_asic, vocab_rows: "124160-248319", place: bracket end}
  U_M0a: {class: lpddr5x}
  U_M0b: {class: lpddr5x}
  U_M1a: {class: lpddr5x}
  U_M1b: {class: lpddr5x}
  U_M2a: {class: lpddr5x}
  U_M2b: {class: lpddr5x}
  U_M3a: {class: lpddr5x}
  U_M3b: {class: lpddr5x}
  U_M4a: {class: lpddr5x}
  U_M4b: {class: lpddr5x}
  U_M5a: {class: lpddr5x}
  U_M5b: {class: lpddr5x}
  U_M6a: {class: lpddr5x}
  U_M6b: {class: lpddr5x}
  U_M7a: {class: lpddr5x}
  U_M7b: {class: lpddr5x}
  U_D0: {class: ddr4}
  U_D1: {class: ddr4}
  U_D2: {class: ddr4}
  U_D3: {class: ddr4}
  U_CLK: {class: clock_gen}
  J_SFP: {class: sfp_cage}

# Point-to-point buses. `link` is the activation ring; each hop is one
# source-synchronous parallel link (see interface_kinds).
nets:
  ring:
    kind: link
    hops:
      - [U_FPGA.link_out, U_A0.link_in]
      - [U_A0.link_out, U_A1.link_in]
      - [U_A1.link_out, U_A2.link_in]
      - [U_A2.link_out, U_A3.link_in]
      - [U_A3.link_out, U_A4.link_in]
      - [U_A4.link_out, U_A5.link_in]
      - [U_A5.link_out, U_A6.link_in]
      - [U_A6.link_out, U_A7.link_in]
      - [U_A7.link_out, U_H0.link_in]
      - [U_H0.link_out, U_H1.link_in]
      - [U_H1.link_out, U_FPGA.link_in]
  memory:
    kind: lpddr5x_x32
    channels:
      - [U_A0.lpddr_ch0, U_M0a.channel]
      - [U_A0.lpddr_ch1, U_M0b.channel]
      - [U_A1.lpddr_ch0, U_M1a.channel]
      - [U_A1.lpddr_ch1, U_M1b.channel]
      - [U_A2.lpddr_ch0, U_M2a.channel]
      - [U_A2.lpddr_ch1, U_M2b.channel]
      - [U_A3.lpddr_ch0, U_M3a.channel]
      - [U_A3.lpddr_ch1, U_M3b.channel]
      - [U_A4.lpddr_ch0, U_M4a.channel]
      - [U_A4.lpddr_ch1, U_M4b.channel]
      - [U_A5.lpddr_ch0, U_M5a.channel]
      - [U_A5.lpddr_ch1, U_M5b.channel]
      - [U_A6.lpddr_ch0, U_M6a.channel]
      - [U_A6.lpddr_ch1, U_M6b.channel]
      - [U_A7.lpddr_ch0, U_M7a.channel]
      - [U_A7.lpddr_ch1, U_M7b.channel]
  fpga_ddr4:
    kind: ddr4_x16
    channels:
      - [U_FPGA.ddr4, U_D0.channel]
      - [U_FPGA.ddr4, U_D1.channel]
      - [U_FPGA.ddr4, U_D2.channel]
      - [U_FPGA.ddr4, U_D3.channel]
  mgmt:
    kind: mgmt_spi
    master: U_FPGA.mgmt_master
    slaves: [U_A0, U_A1, U_A2, U_A3, U_A4, U_A5, U_A6, U_A7, U_H0, U_H1]
  jtag:
    kind: jtag
    chain: [U_FPGA, U_A0, U_A1, U_A2, U_A3, U_A4, U_A5, U_A6, U_A7, U_H0, U_H1]
  refclk:
    kind: refclk
    source: U_CLK
    sinks: [U_FPGA, U_A0, U_A1, U_A2, U_A3, U_A4, U_A5, U_A6, U_A7, U_H0, U_H1]

# Signal-level definition of each interface kind (pin budget per instance).
interface_kinds:
  link:
    description: 32-bit source-synchronous DDR parallel link, 250 MHz clock (2 GB/s raw), ready/valid, CRC in packet
    signals: {data: 32, clock: 1, valid: 1, ready_back: 1, sof: 1}
    io_standard: 1.8 V LVCMOS series-terminated (placeholder; LVDS x8 at 2 Gb/s is the fallback)
    max_length_mm: 80
  lpddr5x_x32:
    description: one LPDDR5X x32 device (two x16 channels)
    signals: {dq: 32, dqs_pairs: 4, dmi: 4, ca: 14, cs: 2, ck_pairs: 2, reset: 1}
  ddr4_x16:
    signals: {dq: 16, dqs_pairs: 2, dm: 2, addr_cmd: 28, ck_pairs: 1, ctrl: 6}
  ddr4_x64:
    description: FPGA-side aggregate of four ddr4_x16 devices
    signals: {dq: 64, dqs_pairs: 8, dm: 8, addr_cmd: 28, ck_pairs: 1, ctrl: 6}
  pcie_gen4_x8:
    signals: {tx_pairs: 8, rx_pairs: 8, refclk_pair: 1, perst: 1, wake: 1}
  mgmt_spi:
    description: SPI from FPGA, one chip select per ASIC; telemetry, config, thermal diode readout
    signals: {sclk: 1, mosi: 1, miso: 1, cs: 1, irq: 1}
  jtag:
    signals: {tck: 1, tms: 1, tdi: 1, tdo: 1, trst: 1}
  refclk:
    signals: {clk_pair: 1}
  strap:
    signals: {pins: 2}
  sfp_plus:
    signals: {tx_pair: 1, rx_pair: 1, i2c: 2, ctrl: 4}
  qspi:
    signals: {pins: 6}
  uart:
    signals: {pins: 2}

# Power tree: 12 V intermediate bus from the slot and aux connector, then
# point-of-load regulators.  Currents are placeholders derived from tdp_w.
power_tree:
  input_bus: 12 V (slot + 8-pin aux, ORed with ideal-diode controllers)
  regulator_efficiency: 0.85
  rails:
    VDD_CORE:    {volts: 0.80, per: [layer_asic, head_asic], note: one multiphase PoL buck per ASIC, PMBus; ~50 A each at the design point, ~170 A at 50K tokens/s (from power_model)}
    VDD_PLL_0V9: {volts: 0.90, per: [layer_asic, head_asic], note: LDO from 1.8 V, one per ASIC}
    VDD_IO_1V8:  {volts: 1.80, shared: true, note: ASIC IO, link IO, clock gen}
    VDD2H_1V05:  {volts: 1.05, shared: true, note: LPDDR5X VDD2H and ASIC PHY}
    VDD2L_0V9:   {volts: 0.90, shared: true, note: LPDDR5X VDD2L}
    VDDQ_0V3:    {volts: 0.30, shared: true, note: LPDDR5X VDDQ}
    VDD1_1V8:    {volts: 1.80, shared: true, note: LPDDR5X VDD1 (may merge with VDD_IO_1V8)}
    VCCINT_0V85: {volts: 0.85, per: [fpga]}
    VCCAUX_1V8:  {volts: 1.80, per: [fpga]}
    VCCO_1V8:    {volts: 1.80, per: [fpga]}
    VCCO_1V2:    {volts: 1.20, per: [fpga], note: DDR4 IO}
    MGTAVCC:     {volts: 0.90, per: [fpga], note: PCIe/SFP transceivers}
    MGTAVTT:     {volts: 1.20, per: [fpga]}
    VDD_1V2:     {volts: 1.20, shared: true, note: DDR4}
    VPP_2V5:     {volts: 2.50, shared: true, note: DDR4}
    VDD_3V3:     {volts: 3.30, shared: true, note: SFP, EEPROM, LEDs, misc}

# Board-level housekeeping not tied to a part class.
misc:
  - board ID EEPROM (I2C)
  - two I2C temperature sensors near ASIC rows plus per-ASIC thermal diode via mgmt SPI
  - PMBus on VDD_CORE regulators for per-ASIC current telemetry
  - FPGA config QSPI flash, JTAG header, UART debug header
  - fan/blower PWM and tach header
  - status LEDs on bracket
